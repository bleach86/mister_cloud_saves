[package]
name = "mister_cloud_saves"
version = "1.0.0"
edition = "2024"

[dependencies]
rocket = { version = "0.5.1", features = ["json"] }
serde = "1.0.228"
serde_json = "1.0.146"
tokio = { version = "1.48.0", features = ["full"] }
flate2 = "1.1.5"
glob = "0.3.3"
uuid = { version = "1.19.0", features = ["v4"] }
base64 = "0.22.1"

openssl-sys = { version = "0.9.101", features = ["vendored"] }
reqwest = { version = "0.12.27", features = ["json"] }
notify = "8.2.0"
notify-debouncer-full = "0.6.0"
futures = "0.3.31"
ini = "1.3.0"
indicatif = "0.18.3"

sled = { version = "0.34", optional = true }

[dependencies.xxhash-rust]
version = "0.8.12"
features = ["xxh3", "const_xxh3"]

[features]
default = []
server = ["sled"]

[[bin]]
name = "mister_save_server"
path = "src/server/main.rs"
required-features = ["server"]

[[bin]]
name = "mister_save_client"
path = "src/client/main.rs"

[lib]
name = "mister_save_utils"
path = "src/mister_save_utils.rs"
